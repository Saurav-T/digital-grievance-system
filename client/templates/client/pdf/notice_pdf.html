<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    /* xhtml2pdf renders via ReportLab and only understands a subset of
       CSS 2.1 — no flexbox/grid, no reliable <hr>, no white-space: pre-line.
       DejaVu Sans (for Unicode/Devanagari support, e.g. Nepali names) is
       only registered when generators.py actually found it on this
       machine — see _pdf_font_context(). If it wasn't found, these blocks
       render as nothing and the body just uses Helvetica. */
    {% if pdf_font_regular %}
    @font-face {
        font-family: "DejaVu Sans";
        src: url("{{ pdf_font_regular }}");
    }
    {% endif %}
    {% if pdf_font_bold %}
    @font-face {
        font-family: "DejaVu Sans";
        font-weight: bold;
        src: url("{{ pdf_font_bold }}");
    }
    {% endif %}

    @page {
        size: a4;
        margin: 2.5cm 3cm;
    }
    body {
        font-family: {% if pdf_font_regular %}"DejaVu Sans", {% endif %}Helvetica, sans-serif;
        color: #1f2937;
        font-size: 11pt;
        line-height: 1.5;
    }
    .letterhead {
        text-align: center;
        margin-bottom: 18px;
    }
    .logo {
        width: 25mm;   /* ← change this to resize the logo — same idea as LOGO_WIDTH_MM */
    }
    .gov-line {
        font-size: 10pt;
        color: #374151;
    }
    .ministry-name {
        font-size: 15pt;
        font-weight: bold;
        color: #1e3a8a;
        margin: 4px 0;
    }
    .address {
        text-align: right;
        font-size: 9pt;
        color: #6b7280;
        margin-bottom: 10px;
    }
    .divider {
        border-top: 1px solid #9ca3af;
        margin: 14px 0;
        font-size: 1px;
        line-height: 1px;
    }
    .doc-title {
        text-align: center;
        font-size: 12pt;
        font-weight: bold;
        text-decoration: underline;
    }
    .doc-date {
        text-align: center;
        font-size: 10pt;
        margin: 4px 0 20px;
    }
    .body-text {
        text-align: justify;
    }
</style>
</head>
<body>

    <div class="letterhead">
        {% if logo_url %}<img class="logo" src="{{ logo_url }}" alt="Emblem">{% endif %}
        <p class="gov-line">Government of Nepal</p>
        <p class="ministry-name">{{ ministry_name }}</p>
    </div>

    {% if address %}<p class="address">{{ address|linebreaksbr }}</p>{% endif %}

    <div class="divider">&nbsp;</div>

    <p class="doc-title">{{ title }}</p>
    <p class="doc-date">Date: {{ date }}</p>

    <p class="body-text">{{ body|linebreaksbr }}</p>

</body>
</html>
